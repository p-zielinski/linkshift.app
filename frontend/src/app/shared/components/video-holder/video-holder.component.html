<div class="video-container" [class.is-ready]="isReady()" [class.is-vertical]="ratio() === '9:16'">
  <video
    #videoElement
    class="video-player"
    playsinline
    [attr.preload]="preload()"
    [attr.poster]="posterSrc()"
    [attr.width]="videoWidth()"
    [attr.height]="videoHeight()"
    [src]="src()"
  ></video>
</div>
