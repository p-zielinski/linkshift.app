<app-resource-card [fillHeight]="true" [className]="className()">
  <div class="min-h-0 flex-1 overflow-auto" [ngClass]="tableClass()">
    <ng-content select="[table-content]" />
  </div>
  @if (showFooter()) {
    <div
      class="mt-3 shrink-0 border-t border-app-border-soft bg-app-surface pt-3"
      [ngClass]="footerClass()"
    >
      <ng-content select="[table-footer]" />
    </div>
  }
</app-resource-card>
