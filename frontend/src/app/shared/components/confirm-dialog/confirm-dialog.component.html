<div class="grid gap-4 p-6">
  <div class="flex items-start gap-4">
    <mat-icon
      class="h-8 w-8 text-[32px]"
      [ngClass]="data.tone === 'warning' ? 'text-red-600' : 'text-app-accent-strong'"
    >
      {{ data.tone === 'warning' ? 'warning' : 'help' }}
    </mat-icon>
    <div>
      <h3 class="m-0 mb-1.5 text-lg font-semibold">{{ data.title }}</h3>
      <p class="text-[13px] text-app-muted">{{ data.message }}</p>
    </div>
  </div>
  <div class="flex justify-end gap-3">
    <button mat-stroked-button (click)="onCancel()">
      {{ data.cancelLabel || 'Cancel' }}
    </button>
    <button mat-flat-button color="primary" (click)="onConfirm()">
      {{ data.confirmLabel || 'Confirm' }}
    </button>
  </div>
</div>
