<app-resource-page-shell
  title="Subdomains"
  subtitle="LinkShift-hosted subdomains mapped to your domain groups."
>
  <div page-actions class="flex items-center gap-2">
    <button mat-flat-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      <span>Add subdomain</span>
    </button>
  </div>

  <div class="flex flex-col gap-4 rounded-[16px] border border-app-border-soft bg-app-surface p-4 sm:flex-row sm:items-center">
    <div class="hidden h-10 w-10 items-center justify-center rounded-full bg-app-background text-app-muted sm:flex">
      <mat-icon>dns</mat-icon>
    </div>
    <div class="flex-1"> 
      <div class="text-[11px] font-semibold uppercase tracking-[0.12em] text-app-muted">Base Routing Host</div>
      <div class="mt-1 text-[14px] text-app-foreground">
        Dynamically created subdomains are automatically resolved against
        <code class="rounded border border-app-border-soft bg-app-background px-1.5 py-0.5 font-mono text-[13px] text-app-foreground">{{ subdomainBaseHost() }}</code>
      </div>
      <div class="mt-2 text-[13px] text-app-muted">
        Resolution format: <code class="rounded bg-app-background px-1.5 py-0.5 font-mono text-[12px]">&lt;subdomain-name&gt;.{{ subdomainBaseHost() }}</code>
      </div>
    </div>
  </div>

  <app-resource-table-card className="flex min-h-0 flex-1 flex-col" [showFooter]="true">
    <div table-content>
      <app-subdomains-table
        [subdomains]="pagedSubdomains()"
        [groupMap]="groupMap()"
        [baseHost]="subdomainBaseHost()"
        (edit)="openEditDialog($event)"
        (delete)="confirmDelete($event)"
      />
    </div>
    <div table-footer>
      <app-table-paginator
        position="center"
        [showCurrentPage]="true"
        [currentPage]="page()"
        [hasNextPage]="hasNextPage()"
        [pageLimitOptions]="pageLimitOptions"
        [pageLimit]="pageLimit()"
        (currentPageChange)="onPageChange($event)"
        (pageLimitChange)="onPageLimitChange($event)"
      />
    </div>
  </app-resource-table-card>
</app-resource-page-shell>
