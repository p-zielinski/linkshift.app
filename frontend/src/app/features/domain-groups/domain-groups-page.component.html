<div class="flex min-h-[calc(100vh-48px)] flex-col">
  <app-page-header
    title="Domain Groups"
    subtitle="Maintain grouping layers for domain routing rules."
  >
    <button mat-flat-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      <span>Add group</span>
    </button>
  </app-page-header>

  <div
    class="flex min-h-0 flex-1 flex-col rounded-[18px] border border-app-border-soft bg-app-surface p-4"
  >
    <div class="min-h-0 flex-1 overflow-auto">
      <table
        mat-table
        [dataSource]="pagedGroups()"
        class="w-full mat-elevation-z0"
      >
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef class="font-semibold">Name</th>
          <td mat-cell *matCellDef="let group" class="py-3">{{ group.name }}</td>
        </ng-container>

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef class="font-semibold">ID</th>
          <td mat-cell *matCellDef="let group" class="py-3">
            <app-resource-pill
              [label]="group.id"
              [tooltip]="'Domain group ID: ' + group.id"
            ></app-resource-pill>
          </td>
        </ng-container>

        <ng-container matColumnDef="domains">
          <th mat-header-cell *matHeaderCellDef class="font-semibold">Domains</th>
          <td mat-cell *matCellDef="let group" class="py-3">
            <span
              class="inline-flex items-center gap-1.5 rounded-full bg-app-muted/10 px-2.5 py-1.5 text-[12px] text-app-muted"
              [matTooltip]="domainCount(group.id) + ' domains linked'"
            >
              {{ domainCount(group.id) }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef class="font-semibold">Created at</th>
          <td mat-cell *matCellDef="let group" class="py-3 text-[13px] text-app-muted">
            {{ group.createdAt | date:'yyyy-MM-dd HH:mm' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let group" class="py-3">
            <div class="flex items-center gap-1">
              <button
                mat-icon-button
                matTooltip="Edit domain group"
                (click)="openEditDialog(group)"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <span
                class="inline-flex"
                [matTooltip]="deleteTooltip(group.id)"
                [matTooltipDisabled]="canDelete(group.id)"
              >
                <button
                  mat-icon-button
                  color="warn"
                  [disabled]="!canDelete(group.id)"
                  (click)="confirmDelete(group.id)"
                >
                  <mat-icon>delete</mat-icon>
                </button>
              </span>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td
            class="mat-cell px-0 py-6 text-center text-[13px] text-app-muted"
            [attr.colspan]="columns.length"
          >
            No domain groups found
          </td>
        </tr>
      </table>
    </div>

    <div class="mt-3 border-t border-app-border-soft pt-3">
      <app-table-paginator
        position="center"
        [showCurrentPage]="true"
        [currentPage]="page()"
        [hasNextPage]="hasNextPage()"
        [pageLimitOptions]="pageLimitOptions"
        [pageLimit]="pageLimit()"
        (currentPageChange)="onPageChange($event)"
        (pageLimitChange)="onPageLimitChange($event)"
      ></app-table-paginator>
    </div>
  </div>
</div>
