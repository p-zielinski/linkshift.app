<form class="h-full" (submit)="onSubmit($event)" (keydown.enter)="$event.preventDefault()">
  <app-wizard
    [title]="dialogTitle"
    subtitle="Organize domains into a routing group."
    [steps]="steps()"
    [saveLabel]="submitLabel"
    [saveDisabled]="groupForm().submitting() || !canSubmit()"
    (save)="onSubmit()"
    (cancel)="onCancel()"
  >
    <ng-template wizardStepSummary="details">
      <div class="text-xs text-app-muted">{{ groupModel().name || 'Unnamed group' }}</div>
    </ng-template>

    <ng-template wizardStep="details">
      <div class="grid gap-4">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Name</mat-label>
          <input matInput type="text" [formField]="groupForm.name" />
          @if (nameError(); as error) {
            <mat-error>{{ error }}</mat-error>
          }
        </mat-form-field>
      </div>
    </ng-template>
  </app-wizard>
</form>
