<div class="grid gap-4 p-6">
  <h3 class="m-0 text-lg font-semibold">{{ dialogTitle }}</h3>
  <form class="grid gap-4" (submit)="onSubmit($event)">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Name</mat-label>
      <input matInput type="text" [formField]="groupForm.name" />
      @if (nameError(); as error) {
        <mat-error>{{ error }}</mat-error>
      }
    </mat-form-field>

    <div class="mt-4 flex justify-end gap-3">
      <button mat-stroked-button type="button" (click)="onCancel()">
        Cancel
      </button>
      <button mat-flat-button color="primary" type="submit" [disabled]="groupForm().submitting()">
        @if (isEdit) {
          <mat-icon>save</mat-icon>
        } @else {
          <mat-icon>add</mat-icon>
        }
        <span>{{ submitLabel }}</span>
      </button>
    </div>
  </form>
</div>
