<table mat-table [dataSource]="groups()" class="min-w-[720px] w-full mat-elevation-z0">
  <ng-container matColumnDef="name">
    <th
      mat-header-cell
      *matHeaderCellDef
      class="font-semibold min-w-[150px] max-w-[250px] truncate"
    >
      Name
    </th>
    <td mat-cell *matCellDef="let group" class="py-3 min-w-[150px] max-w-[250px] truncate">
      {{ group.name }}
    </td>
  </ng-container>

  <ng-container matColumnDef="id">
    <th
      mat-header-cell
      *matHeaderCellDef
      class="font-semibold min-w-[150px] max-w-[250px] truncate"
    >
      Id
    </th>
    <td mat-cell *matCellDef="let group" class="py-3 min-w-[150px] max-w-[250px] truncate">
      <app-resource-pill [label]="group.id" [tooltip]="'Domain group ID: ' + group.id" />
    </td>
  </ng-container>

  <ng-container matColumnDef="robots">
    <th
      mat-header-cell
      *matHeaderCellDef
      class="font-semibold min-w-[150px] max-w-[250px] truncate"
    >
      Robots.txt
    </th>
    <td mat-cell *matCellDef="let group" class="py-3 min-w-[150px] max-w-[250px] truncate">
      <span
        class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1.5 text-[12px]"
        [ngClass]="
          robotsPolicyActive(group.robotsPolicy)
            ? 'bg-green-50 text-green-700'
            : 'bg-app-muted/10 text-app-muted'
        "
      >
        {{ robotsPolicyLabel(group.robotsPolicy) }}
      </span>
    </td>
  </ng-container>

  <ng-container matColumnDef="domains">
    <th
      mat-header-cell
      *matHeaderCellDef
      class="font-semibold min-w-[150px] max-w-[250px] truncate"
    >
      Domains
    </th>
    <td mat-cell *matCellDef="let group" class="py-3 min-w-[150px] max-w-[250px] truncate">
      <span
        class="inline-flex items-center gap-1.5 rounded-full bg-app-muted/10 px-2.5 py-1.5 text-[12px] text-app-muted"
        [matTooltip]="domainCount(group.id) + ' domains linked'"
      >
        {{ domainCount(group.id) }}
      </span>
    </td>
  </ng-container>

  <ng-container matColumnDef="createdAt">
    <th
      mat-header-cell
      *matHeaderCellDef
      class="font-semibold min-w-[150px] max-w-[250px] truncate"
    >
      Created at
    </th>
    <td
      mat-cell
      *matCellDef="let group"
      class="py-3 min-w-[150px] max-w-[250px] truncate text-[13px] text-app-muted"
    >
      {{ group.createdAt | date: 'yyyy-MM-dd HH:mm' }}
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef class="min-w-[150px] max-w-[250px] truncate"></th>
    <td mat-cell *matCellDef="let group" class="py-3 min-w-[150px] max-w-[250px] truncate">
      <div class="flex items-center gap-1">
        <button mat-icon-button matTooltip="Edit domain group" (click)="onEdit(group)">
          <mat-icon>edit</mat-icon>
        </button>
        <span
          class="inline-flex"
          [matTooltip]="deleteTooltip(group.id)"
          [matTooltipDisabled]="canDelete(group.id)"
        >
          <button
            mat-icon-button
            color="warn"
            [disabled]="!canDelete(group.id)"
            (click)="onDelete(group.id)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </span>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
  <tr class="mat-row" *matNoDataRow>
    <td
      class="mat-cell px-0 py-6 text-center text-[13px] text-app-muted"
      [attr.colspan]="columns.length"
    >
      No domain groups found
    </td>
  </tr>
</table>
