<div class="dialog-title" mat-dialog-title>
  <div class="flex flex-col w-full">
    <h2 class="dialog-title-text">Upgrade your subscription</h2>
    <p class="dialog-subtitle text-[13px] text-app-muted">
    Compare plans and choose the tier that matches your routing volume.
  </p>
  </div>

  <button
    mat-icon-button
    class="close-button"
    type="button"
    aria-label="Close dialog"
    (click)="close()"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>

<div mat-dialog-content>
  <app-pricing-plans
    [actionMode]="'select'"
    [currentPlan]="data.currentPlan"
    [customLink]="'/contact'"
    [planBlockReasons]="planBlockReasons()"
    (planSelected)="onPlanSelected($event)"
    (customRequested)="onCustomRequested()"
  ></app-pricing-plans>
  <div class="mt-4 text-[12px] text-app-muted">
    Need a custom plan? Use the contact page to request a tailored setup.
  </div>
</div>

<div class="dialog-spacer"></div>
