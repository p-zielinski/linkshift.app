@if (visible()) {
  <div
    class="border-b border-[rgba(33,33,33,0.1)] bg-[#2b2127] text-[#f7f4f5]"
    role="status"
    data-testid="sunset-banner"
  >
    <div
      class="mx-auto flex w-full max-w-[1280px] flex-col gap-3 px-4 py-2.5 sm:flex-row sm:items-center sm:justify-between sm:gap-4"
    >
      <p class="m-0 text-sm leading-snug text-[#f7f4f5]/90">
        LinkShift.app is
        <a
          class="font-medium text-white underline decoration-white/40 underline-offset-2 hover:decoration-white"
          [href]="githubRepoUrl"
          target="_blank"
          rel="noopener noreferrer"
          >open source (MIT)</a
        >. Hosted service runs through
        <span class="whitespace-nowrap font-medium text-white">February 2027</span>
        unless we reach
        <span class="whitespace-nowrap font-medium text-white">$500 MRR</span>.
      </p>

      <div class="flex shrink-0 items-center gap-1 sm:gap-2">
        <a
          mat-button
          class="!text-white hover:!bg-white/10"
          [href]="githubRepoUrl"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
        <a mat-button class="!text-white hover:!bg-white/10" routerLink="/pricing">Pricing</a>
        <a mat-flat-button color="primary" class="app-cta-button" routerLink="/auth">Sign up</a>
        <button
          mat-icon-button
          type="button"
          class="!text-white/80 hover:!bg-white/10 hover:!text-white"
          aria-label="Dismiss announcement"
          (click)="dismiss()"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>
  </div>
}
