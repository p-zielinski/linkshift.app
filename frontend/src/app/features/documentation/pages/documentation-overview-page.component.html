@if (page(); as pageData) {
  <section class="grid min-w-0 gap-4">
    <mat-card
      class="min-w-0 overflow-hidden border border-[rgba(31,24,28,0.14)] bg-[radial-gradient(circle_at_top_right,#fff3f7_0%,#fff_48%,#f7f2f6_100%)] p-5 sm:p-6"
    >
      <app-markdown-renderer
        [markdown]="heroMarkdown()"
        [sourcePath]="pageData.sourcePath"
      />

      <div class="mt-4 grid gap-3 sm:grid-cols-3">
        <div class="rounded-xl border border-[rgba(31,24,28,0.1)] bg-white/85 p-3">
          <div class="text-xl font-semibold">{{ endpointCount() }}</div>
          <div class="text-xs text-app-muted">Endpoints</div>
        </div>
        <div class="rounded-xl border border-[rgba(31,24,28,0.1)] bg-white/85 p-3">
          <div class="text-xl font-semibold">{{ tagCount() }}</div>
          <div class="text-xs text-app-muted">Tags</div>
        </div>
        <div class="rounded-xl border border-[rgba(31,24,28,0.1)] bg-white/85 p-3">
          <div class="text-xl font-semibold">{{ guideAndConceptCount() }}</div>
          <div class="text-xs text-app-muted">Guides and concepts</div>
        </div>
      </div>

      <div class="mt-5 flex flex-wrap gap-2">
        <a mat-flat-button color="primary" [href]="openApiSpecPath" download>
          Download OpenAPI spec
        </a>
        <a mat-stroked-button routerLink="/docs/guides/getting-started">Read getting started</a>
      </div>
    </mat-card>

    @if (bodyMarkdown()) {
      <mat-card class="min-w-0 overflow-hidden p-5 sm:p-6">
        <app-markdown-renderer
          [markdown]="bodyMarkdown()"
          [sourcePath]="pageData.sourcePath"
        />
      </mat-card>
    }
  </section>
} @else {
  <mat-card class="max-w-2xl p-5">
    <h1 class="text-xl font-semibold">Overview not found</h1>
    <p class="mt-2 text-app-muted">Run docs sync to regenerate documentation content.</p>
  </mat-card>
}
