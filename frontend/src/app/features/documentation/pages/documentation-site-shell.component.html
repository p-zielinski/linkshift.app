<div class="flex h-dvh max-h-dvh w-full flex-col overflow-hidden">
  @if (!isMobile()) {
    <mat-toolbar
      class="sticky top-0 z-10 h-auto min-h-0 border-b border-[rgba(33,33,33,0.08)] bg-[linear-gradient(120deg,#fff3f6_0%,#fff_55%,#f7edf2_100%)] text-[#241c21]"
    >
      <div class="mx-auto flex w-full max-w-[1280px] flex-wrap items-center gap-4 px-4 py-2">
        <a class="inline-flex items-center gap-2.5 no-underline text-inherit" routerLink="/home">
          <app-logo />
        </a>

        <span class="flex-1"></span>

        <nav class="inline-flex items-center gap-1">
          <a
            mat-button
            class="!text-[#2b2127] hover:!text-[var(--app-accent-strong)]"
            routerLink="/home"
            routerLinkActive="!rounded-full !bg-[rgba(192,55,98,0.14)] !font-semibold !text-[var(--app-accent-strong)]"
            >Home</a
          >
          <a
            mat-button
            class="!text-[#2b2127] hover:!text-[var(--app-accent-strong)]"
            routerLink="/use-cases"
            routerLinkActive="!rounded-full !bg-[rgba(192,55,98,0.14)] !font-semibold !text-[var(--app-accent-strong)]"
            >Use Cases</a
          >
          <a
            mat-button
            class="!text-[#2b2127] hover:!text-[var(--app-accent-strong)]"
            routerLink="/docs"
            routerLinkActive="!rounded-full !bg-[rgba(192,55,98,0.14)] !font-semibold !text-[var(--app-accent-strong)]"
            >Docs</a
          >
          <a
            mat-button
            class="!text-[#2b2127] hover:!text-[var(--app-accent-strong)]"
            routerLink="/blog"
            routerLinkActive="!rounded-full !bg-[rgba(192,55,98,0.14)] !font-semibold !text-[var(--app-accent-strong)]"
            >Blog</a
          >
          <a
            mat-button
            class="!text-[#2b2127] hover:!text-[var(--app-accent-strong)]"
            routerLink="/pricing"
            routerLinkActive="!rounded-full !bg-[rgba(192,55,98,0.14)] !font-semibold !text-[var(--app-accent-strong)]"
            >Pricing</a
          >
          <a
            mat-button
            class="!text-[#2b2127] hover:!text-[var(--app-accent-strong)]"
            routerLink="/contact"
            routerLinkActive="!rounded-full !bg-[rgba(192,55,98,0.14)] !font-semibold !text-[var(--app-accent-strong)]"
            >Contact</a
          >
        </nav>

        <div class="inline-flex items-center gap-2">
          <a
            mat-button
            class="!text-[#2b2127] hover:!text-[var(--app-accent-strong)]"
            routerLink="/auth"
            >Sign in</a
          >
          <a mat-flat-button color="primary" routerLink="/auth">Start now</a>
        </div>
      </div>
    </mat-toolbar>
  }

  <main class="docs-site-content flex-1 overflow-hidden">
    <router-outlet />
  </main>
</div>
