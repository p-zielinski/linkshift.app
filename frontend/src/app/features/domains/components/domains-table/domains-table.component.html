<table mat-table [dataSource]="domains()" class="min-w-[720px] w-full mat-elevation-z0">
  <ng-container matColumnDef="name">
    <th
      mat-header-cell
      *matHeaderCellDef
      class="font-semibold min-w-[150px] max-w-[250px] truncate"
    >
      Name
    </th>
    <td mat-cell *matCellDef="let domain" class="py-3 min-w-[150px] max-w-[250px] truncate">
      {{ domain.name }}
    </td>
  </ng-container>

  <ng-container matColumnDef="id">
    <th
      mat-header-cell
      *matHeaderCellDef
      class="font-semibold min-w-[150px] max-w-[250px] truncate"
    >
      Id
    </th>
    <td mat-cell *matCellDef="let domain" class="py-3 min-w-[150px] max-w-[250px] truncate">
      <app-resource-pill [label]="domain.id" [tooltip]="'Domain ID: ' + domain.id" />
    </td>
  </ng-container>

  <ng-container matColumnDef="group">
    <th
      mat-header-cell
      *matHeaderCellDef
      class="font-semibold min-w-[150px] max-w-[250px] truncate"
    >
      Domain group
    </th>
    <td mat-cell *matCellDef="let domain" class="py-3 min-w-[150px] max-w-[250px] truncate">
      <app-resource-pill
        [label]="groupLabel(domain.domainGroupId)"
        [tooltip]="groupTooltip(domain.domainGroupId)"
      />
    </td>
  </ng-container>

  <ng-container matColumnDef="createdAt">
    <th
      mat-header-cell
      *matHeaderCellDef
      class="font-semibold min-w-[150px] max-w-[250px] truncate"
    >
      Created at
    </th>
    <td
      mat-cell
      *matCellDef="let domain"
      class="py-3 min-w-[150px] max-w-[250px] truncate text-[13px] text-app-muted"
    >
      {{ domain.createdAt | date: 'yyyy-MM-dd HH:mm' }}
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef class="min-w-[150px] max-w-[250px] truncate"></th>
    <td mat-cell *matCellDef="let domain" class="py-3 min-w-[150px] max-w-[250px] truncate">
      <div class="flex items-center gap-1">
        <button mat-icon-button matTooltip="Edit domain" (click)="onEdit(domain)">
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          color="warn"
          matTooltip="Delete domain"
          (click)="onDelete(domain.id)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
  <tr class="mat-row" *matNoDataRow>
    <td
      class="mat-cell px-0 py-6 text-center text-[13px] text-app-muted"
      [attr.colspan]="columns.length"
    >
      No domains found
    </td>
  </tr>
</table>
