<div class="flex min-h-[calc(100vh-48px)] flex-col">
  <app-page-header
    title="Domains"
    subtitle="Registered hostnames available for redirect routing."
  >
    <button mat-flat-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      <span>Add domain</span>
    </button>
  </app-page-header>

  <div
    class="flex min-h-0 flex-1 flex-col rounded-[18px] border border-app-border-soft bg-app-surface p-4"
  >
    <div class="min-h-0 flex-1 overflow-auto">
      @if (pagedDomains().length > 0) {
        <table
          mat-table
          [dataSource]="pagedDomains()"
          class="w-full mat-elevation-z0"
        >
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef class="font-semibold">Domain</th>
            <td mat-cell *matCellDef="let domain" class="py-3">{{ domain.name }}</td>
          </ng-container>

          <ng-container matColumnDef="group">
            <th mat-header-cell *matHeaderCellDef class="font-semibold">Domain group</th>
            <td mat-cell *matCellDef="let domain" class="py-3">
              <app-resource-pill
                [label]="groupLabel(domain.domainGroupId)"
                [tooltip]="groupTooltip(domain.domainGroupId)"
              ></app-resource-pill>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="font-semibold">Actions</th>
            <td mat-cell *matCellDef="let domain" class="py-3">
              <button
                mat-icon-button
                color="warn"
                matTooltip="Delete domain"
                (click)="confirmDelete(domain.id)"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columns"></tr>
          <tr mat-row *matRowDef="let row; columns: columns"></tr>
        </table>
      } @else {
        <div class="flex h-full items-center justify-center text-[13px] text-app-muted">
          No domains found.
        </div>
      }
    </div>

    <div class="mt-3 border-t border-app-border-soft pt-3">
      <app-table-paginator
        position="center"
        [showCurrentPage]="true"
        [currentPage]="page()"
        [hasNextPage]="hasNextPage()"
        [pageLimitOptions]="pageLimitOptions"
        [pageLimit]="pageLimit()"
        (currentPageChange)="onPageChange($event)"
        (pageLimitChange)="onPageLimitChange($event)"
      ></app-table-paginator>
    </div>
  </div>
</div>
