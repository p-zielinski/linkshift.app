<app-resource-page-shell
  title="Domains"
  subtitle="Registered hostnames available for redirect routing."
  [bodyScroll]="false"
>
  <div page-actions class="flex items-center gap-2">
    <button mat-stroked-button color="primary" (click)="openSetupDialog()">
      <mat-icon>help</mat-icon>
      <span>Domain setup</span>
    </button>
    <button mat-flat-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      <span>Add domain</span>
    </button>
  </div>

  <app-resource-table-card className="flex min-h-0 flex-1 flex-col" [showFooter]="true">
    <div table-content>
      <app-domains-table
        [domains]="pagedDomains()"
        [groupMap]="groupMap()"
        [loading]="loading()"
        [workspaceFilterActive]="!!activeGroupId()"
        [totalUnfilteredCount]="domains().length"
        (create)="openCreateDialog()"
        (edit)="openEditDialog($event)"
        (delete)="confirmDelete($event)"
      />
    </div>
    <div table-footer>
      <app-table-paginator
        position="center"
        [showCurrentPage]="true"
        [currentPage]="page()"
        [hasNextPage]="hasNextPage()"
        [isLoading]="loading()"
        [pageLimitOptions]="pageLimitOptions"
        [pageLimit]="pageLimit()"
        (currentPageChange)="onPageChange($event)"
        (pageLimitChange)="onPageLimitChange($event)"
      />
    </div>
  </app-resource-table-card>
</app-resource-page-shell>
