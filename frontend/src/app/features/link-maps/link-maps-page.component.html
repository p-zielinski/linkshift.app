<app-resource-page-shell
  title="Link Maps"
  subtitle="Create reusable short-link maps for each domain group."
>
  <div page-actions>
    <button mat-flat-button color="primary" (click)="openCreateDialog()" [disabled]="!activeGroupId()">
      <mat-icon>add</mat-icon>
      <span>Add link map</span>
    </button>
  </div>

  <app-resource-card>
    <div class="grid gap-4 md:grid-cols-[minmax(220px,1fr)_2fr]">
      <app-domain-group-select
        [groups]="domainGroups()"
        [formField]="filterForm.domainGroupId"
      ></app-domain-group-select>

      <div class="rounded-[14px] border border-app-border-soft bg-app-surface p-3 text-[12px] text-app-muted">
        Link maps turn short keys into full destinations. Use a redirect rule with path prefix
        (for example <code>/short</code>) to route to a chosen map.
      </div>
    </div>
  </app-resource-card>

  <app-resource-table-card className="flex min-h-0 flex-1 flex-col">
    <div table-content>
      <app-link-maps-table
        [maps]="linkMaps()"
        [activeGroupId]="activeGroupId()"
        [loading]="loading()"
        (edit)="openEditDialog($event)"
        (delete)="deleteMap($event)"
      ></app-link-maps-table>
    </div>
  </app-resource-table-card>
</app-resource-page-shell>
