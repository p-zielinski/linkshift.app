<table
  mat-table
  [dataSource]="rowViewModels()"
  [trackBy]="trackRow"
  aria-label="Link map entries"
  class="table-fixed min-w-[900px] w-full mat-elevation-z0"
>
  <ng-container matColumnDef="select">
    <th mat-header-cell *matHeaderCellDef class="w-[52px] px-2">
      <mat-checkbox
        aria-label="Select all entries"
        [checked]="allSelected()"
        [indeterminate]="someSelected()"
        (change)="onToggleAll($event.checked)"
      />
    </th>
    <td mat-cell *matCellDef="let row" class="w-[52px] px-2">
      <mat-checkbox
        [attr.aria-label]="'Select entry ' + (row.entry.key || '(root)')"
        [checked]="row.isSelected"
        (change)="onToggleOne(row.entry.id, $event.checked)"
      />
    </td>
  </ng-container>

  <ng-container matColumnDef="key">
    <th mat-header-cell *matHeaderCellDef class="font-semibold w-[280px] truncate">Key</th>
    <td
      mat-cell
      *matCellDef="let row"
      class="py-3 truncate max-w-0 font-medium"
      [matTooltip]="row.entry.key"
    >
      {{ row.entry.key || '(root)' }}
    </td>
  </ng-container>

  <ng-container matColumnDef="destination">
    <th mat-header-cell *matHeaderCellDef class="font-semibold truncate">Destination</th>
    <td
      mat-cell
      *matCellDef="let row"
      class="py-3 truncate max-w-0"
      [matTooltip]="row.entry.destination"
    >
      {{ row.entry.destination }}
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef class="w-[72px]"></th>
    <td mat-cell *matCellDef="let row" class="py-3 w-[72px]">
      <button
        mat-icon-button
        type="button"
        matTooltip="Edit entry"
        [attr.aria-label]="'Edit entry ' + row.entry.key"
        (click)="onEdit(row.entry)"
      >
        <mat-icon>edit</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
  <tr class="mat-row" *matNoDataRow>
    <td
      class="mat-cell px-0 py-6 text-center text-[13px] text-app-muted"
      [attr.colspan]="columns.length"
    >
      @if (loading()) {
        Loading entries…
      } @else {
        No entries found.
      }
    </td>
  </tr>
</table>
