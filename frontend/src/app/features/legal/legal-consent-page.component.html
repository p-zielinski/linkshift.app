<app-resource-page-shell
  title="Review updated terms"
  subtitle="Accept the latest terms to continue using {{ siteConfig.name }}."
>
  <app-resource-card className="mx-auto w-full max-w-[520px]">
    <div
      class="grid gap-2 rounded-[16px] border border-app-border-soft bg-app-muted/5 p-3 text-[12px] text-app-muted"
    >
      <mat-checkbox [formField]="consentForm.acceptTerms">
        I agree to the <a routerLink="/terms" class="text-app-accent-strong">Terms of Service</a>.
      </mat-checkbox>
      @if (termsError()) {
        <div class="text-[11px] text-red-600">{{ termsError() }}</div>
      }

      <mat-checkbox [formField]="consentForm.acceptPrivacy">
        I agree to the <a routerLink="/privacy" class="text-app-accent-strong">Privacy Policy</a>.
      </mat-checkbox>
      @if (privacyError()) {
        <div class="text-[11px] text-red-600">{{ privacyError() }}</div>
      }

      <mat-checkbox [formField]="consentForm.confirmAge">
        I confirm that I am at least {{ siteConfig.minAge }} years old.
      </mat-checkbox>
      @if (ageError()) {
        <div class="text-[11px] text-red-600">{{ ageError() }}</div>
      }
    </div>

    <div class="mt-5 flex justify-end">
      <button mat-flat-button color="primary" type="button" (click)="submit()" [disabled]="busy()">
        {{ busy() ? 'Saving…' : 'Continue' }}
      </button>
    </div>
  </app-resource-card>
</app-resource-page-shell>
