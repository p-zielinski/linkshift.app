<div class="auth-shell flex min-h-[calc(100vh-48px)] items-center justify-center px-4 py-10">
  <mat-card class="auth-card w-[min(480px,96vw)] rounded-[20px] p-6 text-center">
    @if (verifying()) {
      <mat-progress-spinner diameter="48" mode="indeterminate" />
      <h2 class="mt-4 text-lg font-semibold text-app-foreground">Verifying your email</h2>
      <p class="mt-1 text-[13px] text-app-muted">This will only take a moment.</p>
    } @else if (success()) {
      <h2 class="m-0 text-lg font-semibold text-app-foreground">Email verified</h2>
      <p class="mt-2 text-[13px] text-app-muted">
        Your email has been confirmed. You can now sign in.
      </p>
      <a mat-flat-button color="primary" routerLink="/auth" class="mt-4 inline-flex">
        Go to login
      </a>
    } @else {
      <h2 class="m-0 text-lg font-semibold text-app-foreground">Verification failed</h2>
      <p class="mt-2 text-[13px] text-app-muted">{{ error() }}</p>
      <a mat-stroked-button color="primary" routerLink="/auth" class="mt-4 inline-flex">
        Back to login
      </a>
    }
  </mat-card>
</div>
