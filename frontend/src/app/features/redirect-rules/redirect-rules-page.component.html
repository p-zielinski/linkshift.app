<app-resource-page-shell
  title="Redirect Rules"
  subtitle="Define path-level routing actions for each domain group."
>
  <div page-actions>
    <button
      mat-flat-button
      color="primary"
      (click)="openCreateDialog()"
      [disabled]="!activeGroupId()"
    >
      <mat-icon>add</mat-icon>
      <span>Add rule</span>
    </button>
  </div>

  <app-resource-card>
    <div class="grid gap-4 md:grid-cols-[minmax(220px,1fr)_2fr]">
      <app-domain-group-select
        [groups]="domainGroups()"
        [formField]="filterForm.domainGroupId"
      ></app-domain-group-select>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
        <mat-label>Search source or destination</mat-label>
        <input matInput type="text" [formField]="filterForm.search" />
      </mat-form-field>
    </div>
  </app-resource-card>

  <app-redirect-tests-summary-card
    [activeGroupId]="activeGroupId()"
    [activeGroupLabel]="groupLabel(activeGroupId())"
    [metrics]="testsMetrics()"
    [loading]="testsLoading()"
    [error]="testsError()"
    (runTests)="runTests()"
  ></app-redirect-tests-summary-card>

  <app-resource-table-card className="flex min-h-0 flex-1 flex-col" [showFooter]="true">
    <div table-content>
      <app-redirect-rules-table
        [rules]="rules()"
        [groupMap]="groupMap()"
        (edit)="openEditDialog($event)"
        (delete)="confirmDelete($event)"
      ></app-redirect-rules-table>
    </div>
    <div table-footer>
      <app-table-paginator
        position="center"
        [showCurrentPage]="true"
        [currentPage]="page()"
        [hasNextPage]="hasNextPage()"
        [pageLimitOptions]="pageLimitOptions"
        [pageLimit]="pageLimit()"
        (currentPageChange)="onPageChange($event)"
        (pageLimitChange)="onPageLimitChange($event)"
      ></app-table-paginator>
    </div>
  </app-resource-table-card>
</app-resource-page-shell>
