<app-resource-page-shell
  title="Tests"
  subtitle="Validate redirect outcomes without leaving the dashboard."
  [bodyScroll]="false"
>
  <div page-actions class="flex flex-wrap items-center gap-2">
    <button
      mat-stroked-button
      color="primary"
      (click)="runPendingTests()"
      [disabled]="!activeGroupId()"
    >
      <mat-icon>play_arrow</mat-icon>
      <span>Run tests</span>
    </button>
    <button
      mat-flat-button
      color="primary"
      (click)="openCreateDialog()"
      [disabled]="!activeGroupId()"
    >
      <mat-icon>add</mat-icon>
      <span>Add test</span>
    </button>
  </div>

  <app-resource-card class="shrink-0">
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
      <mat-label>Search by path or query</mat-label>
      <input matInput type="text" [formField]="filterForm.search" />
    </mat-form-field>
  </app-resource-card>

  <app-resource-table-card className="flex min-h-0 flex-1 flex-col" [showFooter]="true">
    <div table-content>
      <app-tests-table
        [tests]="tests()"
        [activeGroupId]="activeGroupId()"
        [listReady]="listReady()"
        [runStates]="runStates()"
        [runningTestIds]="runningTestIds()"
        (runTest)="runSingleTest($event)"
        (viewResult)="openResultDialog($event)"
        (edit)="openEditDialog($event)"
        (delete)="confirmDelete($event)"
      />
    </div>
    <div table-footer>
      <app-table-paginator
        position="center"
        [showCurrentPage]="true"
        [currentPage]="page()"
        [hasNextPage]="hasNextPage()"
        [isLoading]="loading()"
        [pageLimitOptions]="pageLimitOptions"
        [pageLimit]="pageLimit()"
        (currentPageChange)="onPageChange($event)"
        (pageLimitChange)="onPageLimitChange($event)"
      />
    </div>
  </app-resource-table-card>
</app-resource-page-shell>
