<mat-sidenav-container class="app-shell page-background h-screen h-[100dvh]">
  <mat-sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile() || mobileNavOpen()"
    [fixedInViewport]="isMobile()"
    [autoFocus]="isMobile() ? false : 'dialog'"
    (openedChange)="onSidenavOpenedChange($event)"
  >
    <div
      class="flex h-full min-h-0 flex-col bg-[linear-gradient(160deg,var(--color-app-shell-start)_0%,var(--color-app-shell-mid)_60%,var(--color-app-shell-end)_100%)] px-4 py-6"
    >
      <div class="mb-6">
        <app-logo />
        <div class="text-[13px] text-app-muted">Environment-ready routing</div>
      </div>

      <div class="mb-2 shrink-0">
        <button
          type="button"
          class="app-sidebar-ask"
          [class.app-sidebar-ask--active]="assistantDrawerOpen()"
          aria-label="Open Ask docs"
          [attr.aria-expanded]="assistantDrawerOpen()"
          (click)="openAssistantDrawer()"
        >
          <span class="app-sidebar-ask__icon-badge" aria-hidden="true">
            <mat-icon class="app-sidebar-ask__icon">auto_awesome</mat-icon>
          </span>
          <span class="min-w-0 flex-1">
            <span class="app-sidebar-ask__title-row">
              <span class="app-sidebar-ask__title">Ask docs</span>
              <span class="app-sidebar-ask__ai-tag">AI</span>
            </span>
            <span class="app-sidebar-ask__hint">Answers from documentation</span>
          </span>
        </button>
      </div>

      <div class="min-h-0 flex-1 overflow-y-auto">
        <mat-nav-list>
          @for (item of navItems; track item.route) {
            @if (isDisabled(item)) {
              <a
                mat-list-item
                matTooltip="Create a domain group to access this section."
                [attr.aria-disabled]="true"
                [attr.tabindex]="-1"
                class="cursor-not-allowed opacity-50"
              >
                <mat-icon class="relative top-[-1px] mr-3 align-middle text-[20px]">{{
                  item.icon
                }}</mat-icon>
                <span>{{ item.label }}</span>
              </a>
            } @else {
              <a
                mat-list-item
                [routerLink]="item.route"
                routerLinkActive="rounded-xl bg-app-accent-soft"
                [routerLinkActiveOptions]="{ exact: !item.matchSubRoutes }"
                (click)="onNavigate()"
              >
                <mat-icon class="relative top-[-2px] mr-3 align-middle text-[20px]">{{
                  item.icon
                }}</mat-icon>
                <span>{{ item.label }}</span>
              </a>
            }
          }
        </mat-nav-list>
      </div>

      @if (authStore.user(); as user) {
        <div class="mt-3 flex shrink-0 flex-col gap-3">
          <div
            class="inline-flex items-center gap-1.5 rounded-full bg-app-muted/10 px-2.5 py-1.5 text-[12px] text-app-muted"
          >
            <mat-icon class="h-4 w-4 text-[16px]">account_circle</mat-icon>
            <span class="truncate">{{ user.email }}</span>
          </div>
          <button mat-stroked-button color="primary" (click)="onLogout()">Log out</button>
        </div>
      }
    </div>
  </mat-sidenav>

  <mat-sidenav
    class="app-assistant-drawer"
    position="end"
    mode="over"
    [opened]="assistantDrawerOpen()"
    [fixedInViewport]="true"
    [autoFocus]="false"
    (openedChange)="onAssistantDrawerOpenedChange($event)"
  >
    <app-docs-assistant layout="embedded" (closeRequested)="closeAssistantDrawer()" />
  </mat-sidenav>

  <mat-sidenav-content class="p-4 sm:p-6">
    <div class="mb-4 flex items-center justify-between gap-3 lg:hidden">
      <button mat-icon-button type="button" aria-label="Open menu" (click)="toggleMobileNav()">
        <mat-icon>menu</mat-icon>
      </button>
      <app-logo class="mt-[5px]" />
      <button
        mat-icon-button
        type="button"
        class="!text-[var(--app-accent-strong,#8f2045)]"
        aria-label="Open Ask docs"
        [attr.aria-expanded]="assistantDrawerOpen()"
        (click)="toggleAssistantDrawer()"
      >
        <mat-icon>auto_awesome</mat-icon>
      </button>
    </div>
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
