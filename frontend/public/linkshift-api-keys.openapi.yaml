            schema:
              $ref: '#/components/schemas/UpdateLinkMapEntryRequest'
      responses:
        '200':
          description: Updated link map entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkMapEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Link Map Entries]
      summary: Delete link map entry
      operationId: deleteLinkMapEntry
      responses:
        '200':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key generated in LinkShift dashboard (`Organization -> Manage API keys`).

  parameters:
    EntityId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                code: 401
                key: unauthorized
                message: Unauthorized
                details: Missing or invalid API key.
                requestId: req_example
    PaymentRequired:
      description: API usage requires paid plan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            paymentRequired:
              value:
                code: 402
                key: payment_required
                message: Payment required
                feature: api_access
                details: API key usage is available on paid plans only. Upgrade your subscription to use API access.
                requestId: req_example
    TooManyRequests:
      description: Per-key rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            tooManyRequests:
              value:
                code: 429
                key: too_many_requests
                message: Too many requests
                details: API key rate limit exceeded
                requestId: req_example
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        key:
          type: string
        message:
          type: string
        details:
          type: string
        requestId:
          type: string
        feature:
          type: string
      required: [code, key, message]

    DomainGroup:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        organizationId: { type: string }
        robotsPolicy:
          $ref: '#/components/schemas/RobotsPolicy'
        customRobotsContent:
          type: string
          nullable: true
          maxLength: 4096
          description: Used only when robotsPolicy is CUSTOM.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
      required: [id, name, organizationId, robotsPolicy, createdAt, updatedAt]

    Domain:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        domainGroupId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
      required: [id, name, domainGroupId, createdAt, updatedAt]

    RedirectRule:
      type: object
      properties:
        id: { type: string }
        source: { type: string }
        destination: { type: string, nullable: true }
        statusCode: { type: integer, enum: [301, 302, 307, 308] }
        matchMethod:
          type: array
          items:
            $ref: '#/components/schemas/HttpMethod'
        queryMatch:
          type: string
          enum: [exact, ignore, subset]
        pathMatch:
          type: string
          enum: [exact, prefix]
        linkMapId: { type: string, nullable: true }
        isBlocked: { type: boolean }
        blockedAt: { type: string, format: date-time, nullable: true }
        priority: { type: integer }
        domainGroupId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
      required:
        - id
        - source
        - statusCode
        - matchMethod
        - queryMatch
        - pathMatch
        - priority
        - domainGroupId
        - createdAt
        - updatedAt

    RedirectTest:
      type: object
      properties:
        id: { type: string }
        organizationId: { type: string }
        domainGroupId: { type: string }
        pathWithQuery: { type: string }
        requestData: { type: object, additionalProperties: true }
        expectedResult: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
      required:
        - id
        - organizationId
        - domainGroupId
        - pathWithQuery
        - requestData
        - expectedResult
        - createdAt
        - updatedAt

    LinkMap:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        domainGroupId: { type: string }
        caseSensitive: { type: boolean }
        queryMatch:
          type: string
          enum: [exact, ignore, subset]
        fallbackDestination: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
      required:
        - id
        - name
        - domainGroupId
        - caseSensitive
        - queryMatch
        - createdAt
        - updatedAt

    LinkMapEntry:
      type: object
      properties:
        id: { type: string }
        linkMapId: { type: string }
        key: { type: string }
        keyNormalized: { type: string }
        destination: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
      required:
        - id
        - linkMapId
        - key
        - keyNormalized
        - destination
        - createdAt
        - updatedAt

    OrganizationUsage:
      type: object
      properties:
        domainGroups: { type: integer }
        domains: { type: integer }
        rules: { type: integer }
        tests: { type: integer }
        users: { type: integer }
        apiKeys: { type: integer }
        linkMaps: { type: integer }
        linkMapEntries: { type: integer }
      required: [domainGroups, domains, rules, tests, users, apiKeys, linkMaps, linkMapEntries]

    QueryResultMeta:
      type: object
      properties:
        dataType: { type: string }
        hasMore: { type: boolean }
        moreStartingAfterId: { type: string }
      required: [dataType, hasMore]

    DomainGroupQueryResult:
      allOf:
        - $ref: '#/components/schemas/QueryResultMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/DomainGroup'
          required: [data]

    DomainQueryResult:
      allOf:
        - $ref: '#/components/schemas/QueryResultMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Domain'
          required: [data]

    RedirectRuleQueryResult:
      allOf:
        - $ref: '#/components/schemas/QueryResultMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/RedirectRule'
          required: [data]

    RedirectTestQueryResult:
      allOf:
        - $ref: '#/components/schemas/QueryResultMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/RedirectTest'
          required: [data]

    LinkMapQueryResult:
      allOf:
        - $ref: '#/components/schemas/QueryResultMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/LinkMap'
          required: [data]

    LinkMapEntryQueryResult:
      allOf:
        - $ref: '#/components/schemas/QueryResultMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/LinkMapEntry'
          required: [data]

    HttpMethod:
      type: string
      enum: [GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD]

    RobotsPolicy:
      type: string
      description: |
        Controls robots.txt behavior for all domains in a domain group.
        CUSTOM requires customRobotsContent.
      default: NONE
      enum: [NONE, ALLOW_ALL, DISALLOW_ALL, DISALLOW_BAD_BOTS, CUSTOM]

    CreateDomainGroupRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        robotsPolicy:
          $ref: '#/components/schemas/RobotsPolicy'
        customRobotsContent:
          type: string
          nullable: true
          maxLength: 4096
          description: Required when robotsPolicy is CUSTOM.
      required: [name]

    UpdateDomainGroupRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        robotsPolicy:
          $ref: '#/components/schemas/RobotsPolicy'
        customRobotsContent:
          type: string
          nullable: true
          maxLength: 4096
          description: Required when robotsPolicy is CUSTOM.
      required: [name]

    CreateDomainRequest:
      type: object
      properties:
        name: { type: string }
        domainGroupId: { type: string }
      required: [name, domainGroupId]

    UpdateDomainRequest:
      type: object
      properties:
        name: { type: string }
        domainGroupId: { type: string }

    CreateRedirectRuleRequest:
      type: object
      properties:
        source: { type: string, minLength: 1, maxLength: 16384 }
        destination: { type: string, maxLength: 16384, nullable: true }
        statusCode: { type: integer, enum: [301, 302, 307, 308], default: 302 }
        matchMethod:
          type: array
          items:
            $ref: '#/components/schemas/HttpMethod'
        queryMatch:
          type: string
          enum: [exact, ignore, subset]
          default: exact
        pathMatch:
          type: string
          enum: [exact, prefix]
          default: exact
        linkMapId: { type: string, nullable: true }
        priority: { type: integer, minimum: 0, maximum: 1000, default: 0 }
        domainGroupId: { type: string }
      required: [source, domainGroupId]

    UpdateRedirectRuleRequest:
      type: object
      properties:
        source: { type: string, minLength: 1, maxLength: 16384 }
        destination: { type: string, maxLength: 16384, nullable: true }
        statusCode: { type: integer, enum: [301, 302, 307, 308] }
        matchMethod:
          type: array
          items:
            $ref: '#/components/schemas/HttpMethod'
        queryMatch: { type: string, enum: [exact, ignore, subset] }
        pathMatch: { type: string, enum: [exact, prefix] }
        linkMapId: { type: string, nullable: true }
        priority: { type: integer, minimum: 0, maximum: 1000 }

    SimulateRedirectsRequest:
      type: object
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            properties:
              domainGroupId: { type: string }
              hostname: { type: string }
              path: { type: string }
              method:
                $ref: '#/components/schemas/HttpMethod'
              protocol:
                type: string
                enum: [http, https]
              ip: { type: string }
              userAgent: { type: string }
              headers:
                type: object
                additionalProperties:
                  type: string
              query:
                type: object
                additionalProperties: true
            required: [domainGroupId, path]
      required: [entries]

    RedirectSimulationResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              domainGroupId: { type: string }
              method: { type: string }
              path: { type: string }
              hostname: { type: string }
              matched: { type: boolean }
              statusCode: { type: integer }
              target: { type: string, nullable: true }
            required: [index, domainGroupId, method, path, hostname, matched, statusCode]
      required: [results]

    RedirectRuleAnalyticsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              rule:
                $ref: '#/components/schemas/RedirectRule'
              hits:
                type: integer
              topLinkMapKeys:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    hits: { type: integer }
                  required: [key, hits]
              topRequestVariants:
                type: array
                items:
                  type: object
                  properties:
                    requestMethod: { type: string }
                    requestPath: { type: string }
                    requestQuery: { type: string }
                    requestUrl: { type: string }
                    destination: { type: string }
                    linkMapKey: { type: string, nullable: true }
                    hits: { type: integer }
                  required:
                    [requestMethod, requestPath, requestQuery, requestUrl, destination, hits]
            required: [rule, hits, topLinkMapKeys, topRequestVariants]
      required: [data]

    CreateRedirectTestRequest:
      type: object
      properties:
        domainGroupId: { type: string }
        pathWithQuery: { type: string, minLength: 1, maxLength: 16384 }
        requestData:
          type: object
          additionalProperties: true
        expectedResult:
          type: object
          properties:
            matched: { type: boolean }
            statusCode: { type: integer, minimum: 100, maximum: 599 }
            target: { type: string, nullable: true }
          required: [matched, statusCode, target]
      required: [domainGroupId, pathWithQuery, expectedResult]

    UpdateRedirectTestRequest:
      type: object
      properties:
        pathWithQuery: { type: string, minLength: 1, maxLength: 16384 }
        requestData:
          type: object
          additionalProperties: true
        expectedResult:
          type: object
          properties:
            matched: { type: boolean }
            statusCode: { type: integer, minimum: 100, maximum: 599 }
            target: { type: string, nullable: true }
          required: [matched, statusCode, target]

    CreateLinkMapRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        domainGroupId: { type: string }
        caseSensitive: { type: boolean, default: false }
        queryMatch: { type: string, enum: [exact, ignore, subset], default: ignore }
        fallbackDestination: { type: string }
      required: [name, domainGroupId]

    UpdateLinkMapRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        caseSensitive: { type: boolean }
        queryMatch: { type: string, enum: [exact, ignore, subset] }
        fallbackDestination: { type: string, nullable: true }

    CreateLinkMapEntryRequest:
      type: object
      properties:
        linkMapId: { type: string }
        key: { type: string, minLength: 1, maxLength: 1024 }
        destination: { type: string, minLength: 1, maxLength: 16384 }
      required: [linkMapId, key, destination]

    UpdateLinkMapEntryRequest:
      type: object
      properties:
        key: { type: string, minLength: 1, maxLength: 1024 }
        destination: { type: string, minLength: 1, maxLength: 16384 }

    DeleteLinkMapEntriesByIdRequest:
      type: object
      properties:
        linkMapId: { type: string }
        entryIds:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string }
      required: [linkMapId, entryIds]

    ImportLinkMapEntriesRequest:
      type: object
      properties:
        linkMapId: { type: string }
        entries:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            properties:
              key: { type: string, minLength: 1, maxLength: 1024 }
              destination: { type: string, minLength: 1, maxLength: 16384 }
            required: [key, destination]
      required: [linkMapId, entries]

    ImportLinkMapEntriesResponse:
      type: object
      properties:
        total: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        failed: { type: integer }
        failures:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              key: { type: string }
              reason: { type: string }
            required: [index, key, reason]
      required: [total, created, updated, failed, failures]
