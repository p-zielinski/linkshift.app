version: "3.8"

services:
  frontend:
    image: ${FRONTEND_IMAGE}
    environment:
      NODE_ENV: production
      PORT: "4000"
      APP_DOMAIN_TARGET_IP: ${APP_DOMAIN_TARGET_IP}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_SITE_NAME: ${APP_SITE_NAME}
      APP_SITE_TAGLINE: ${APP_SITE_TAGLINE}
      APP_SUPPORT_EMAIL: ${APP_SUPPORT_EMAIL}
      APP_LEGAL_NAME: ${APP_LEGAL_NAME}
      APP_LEGAL_ADDRESS: ${APP_LEGAL_ADDRESS}
      APP_PRIVACY_EMAIL: ${APP_PRIVACY_EMAIL}
      APP_MIN_AGE: ${APP_MIN_AGE}
      APP_LEGAL_VERSION: ${APP_LEGAL_VERSION}
      APP_AUTH_GATE_ENABLED: ${APP_AUTH_GATE_ENABLED}
    networks:
      inter-stack:
        aliases:
          - frontend
    deploy:
      update_config:
        order: start-first
      restart_policy:
        condition: on-failure

  backend:
    image: ${BACKEND_IMAGE}
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_HOSTNAME: ${BACKEND_HOST}
      APP_WEB_URL: ${APP_WEB_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TRUST_PROXY: "true"
      HOST_ID: ${HOST_ID}
      LEGAL_VERSION: ${LEGAL_VERSION}
      LEGAL_MIN_AGE: ${LEGAL_MIN_AGE}
      LEGAL_ENTITY_NAME: ${LEGAL_ENTITY_NAME}
      LEGAL_ENTITY_ADDRESS: ${LEGAL_ENTITY_ADDRESS}
      PRIVACY_EMAIL: ${PRIVACY_EMAIL}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: default
      LEMON_SQUEEZY_STORE_ID: ${LEMON_SQUEEZY_STORE_ID}
      LEMON_SQUEEZY_SUCCESS_URL: ${LEMON_SQUEEZY_SUCCESS_URL}
      LEMON_SQUEEZY_PRODUCT_ID: ${LEMON_SQUEEZY_PRODUCT_ID}
      LEMON_SQUEEZY_VARIANT_BASIC_MONTHLY_ID: ${LEMON_SQUEEZY_VARIANT_BASIC_MONTHLY_ID}
      LEMON_SQUEEZY_VARIANT_BASIC_YEARLY_ID: ${LEMON_SQUEEZY_VARIANT_BASIC_YEARLY_ID}
      LEMON_SQUEEZY_VARIANT_PRO_MONTHLY_ID: ${LEMON_SQUEEZY_VARIANT_PRO_MONTHLY_ID}
      LEMON_SQUEEZY_VARIANT_PRO_YEARLY_ID: ${LEMON_SQUEEZY_VARIANT_PRO_YEARLY_ID}
      ZEPTOMAIL_API_URL: ${ZEPTOMAIL_API_URL}
      ZEPTOMAIL_FROM_ADDRESS: ${ZEPTOMAIL_FROM_ADDRESS}
      ZEPTOMAIL_FROM_NAME: ${ZEPTOMAIL_FROM_NAME}
      EMAIL_FROM: ${EMAIL_FROM}
    secrets:
      - database_url
      - redis_password
      - jwt_secret
      - jwt_refresh_secret
      - sentry_dsn
      - lemon_squeezy_api_key
      - lemon_squeezy_webhook_secret
      - zeptomail_api_key3
      - web_risk_api_key
    networks:
      inter-stack:
        aliases:
          - backend
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        monitor: 25s
        max_failure_ratio: 0
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        monitor: 25s
        max_failure_ratio: 0
        order: start-first
      replicas: 4
      restart_policy:
        condition: on-failure

  db-backup:
    image: ghcr.io/p-zielinski/linkshift-db-backup:${GIT_COMMIT_HASH:-latest}
    networks:
      - inter-stack
    secrets:
      - db-password
      - backblaze-application-key-id
      - backblaze-application-key
    environment:
      - HOST_ID=eu1
      - DATABASE=linkshift
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD_FILE=/run/secrets/db-password
      - DB_PORT=5432
      - NODE_ENV=production
      - BACKBLAZE_APPLICATION_KEY_ID_FILE=/run/secrets/backblaze-application-key-id
      - BACKBLAZE_APPLICATION_KEY_FILE=/run/secrets/backblaze-application-key
    deploy:
      resources:
        limits:
          memory: 500M
          cpus: "0.50"
      replicas: 1

networks:
  inter-stack:
    external: true
    name: ${SWARM_OVERLAY_NETWORK}

secrets:
  database_url:
    external: true
  redis_password:
    external: true
  jwt_secret:
    external: true
  jwt_refresh_secret:
    external: true
  sentry_dsn:
    external: true
  lemon_squeezy_api_key:
    external: true
  lemon_squeezy_webhook_secret:
    external: true
  zeptomail_api_key3:
    external: true
  web_risk_api_key:
    external: true
  db-password:
    external: true
  backblaze-application-key-id:
    external: true
  backblaze-application-key:
    external: true
