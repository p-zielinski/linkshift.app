version: "3.8"

services:
  frontend:
    image: ${FRONTEND_IMAGE}
    environment:
      NODE_ENV: production
      PORT: "4000"
      APP_DOMAIN_TARGET_IP: ${APP_DOMAIN_TARGET_IP}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_SUBDOMAIN_BASE_URL: ${APP_SUBDOMAIN_BASE_URL}
      APP_TOOLS_BASE_URL: ${APP_TOOLS_BASE_URL}
      APP_SITE_NAME: ${APP_SITE_NAME}
      APP_SITE_TAGLINE: ${APP_SITE_TAGLINE}
      APP_SUPPORT_EMAIL: ${APP_SUPPORT_EMAIL}
      APP_LEGAL_NAME: ${APP_LEGAL_NAME}
      APP_LEGAL_ADDRESS: ${APP_LEGAL_ADDRESS}
      APP_PRIVACY_EMAIL: ${APP_PRIVACY_EMAIL}
      APP_MIN_AGE: ${APP_MIN_AGE}
      APP_LEGAL_VERSION: ${APP_LEGAL_VERSION}
      APP_AUTH_GATE_ENABLED: ${APP_AUTH_GATE_ENABLED}
      APP_PADDLE_CLIENT_TOKEN: ${APP_PADDLE_CLIENT_TOKEN}
      APP_PADDLE_ENV: ${APP_PADDLE_ENV}
      APP_TURNSTILE_SITE_KEY: ${APP_TURNSTILE_SITE_KEY}
    networks:
      inter-stack:
        aliases:
          - frontend
    deploy:
      update_config:
        order: start-first
      restart_policy:
        condition: on-failure

  backend:
    image: ${BACKEND_IMAGE}
    environment:
      NODE_ENV: production
      PORT: "3000"
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      API_HOSTNAME: ${BACKEND_HOST}
      APP_WEB_URL: ${APP_WEB_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TRUST_PROXY: "true"
      HOST_ID: ${HOST_ID}
      LEGAL_VERSION: ${LEGAL_VERSION}
      LEGAL_MIN_AGE: ${LEGAL_MIN_AGE}
      LEGAL_ENTITY_NAME: ${LEGAL_ENTITY_NAME}
      LEGAL_ENTITY_ADDRESS: ${LEGAL_ENTITY_ADDRESS}
      PRIVACY_EMAIL: ${PRIVACY_EMAIL}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: default
      PADDLE_SUCCESS_URL: ${PADDLE_SUCCESS_URL}
      PADDLE_API_VERSION: ${PADDLE_API_VERSION}
      PADDLE_PRICE_BASIC_MONTHLY_ID: ${PADDLE_PRICE_BASIC_MONTHLY_ID}
      PADDLE_PRICE_BASIC_YEARLY_ID: ${PADDLE_PRICE_BASIC_YEARLY_ID}
      PADDLE_PRICE_PRO_MONTHLY_ID: ${PADDLE_PRICE_PRO_MONTHLY_ID}
      PADDLE_PRICE_PRO_YEARLY_ID: ${PADDLE_PRICE_PRO_YEARLY_ID}
      ZEPTOMAIL_API_URL: ${ZEPTOMAIL_API_URL}
      ZEPTOMAIL_FROM_ADDRESS: ${ZEPTOMAIL_FROM_ADDRESS}
      ZEPTOMAIL_FROM_NAME: ${ZEPTOMAIL_FROM_NAME}
      EMAIL_FROM: ${EMAIL_FROM}
      APP_DOMAIN_TARGET_IP: ${APP_DOMAIN_TARGET_IP}
    secrets:
      - database_url
      - redis_password
      - jwt_secret
      - jwt_refresh_secret
      - sentry_dsn
      - paddle_api_key
      - paddle_webhook_secret
      - zeptomail_api_key
      - web_risk_api_key
    networks:
      inter-stack:
        aliases:
          - backend
    deploy:
      update_config:
        parallelism: 1
        delay: 5s
        monitor: 20s
        max_failure_ratio: 0
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
        monitor: 20s
        max_failure_ratio: 0
        order: start-first
      replicas: 4
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 30s

  db-backup:
    image: ghcr.io/p-zielinski/linkshift-db-backup:${GIT_COMMIT_HASH:-latest}
    networks:
      - inter-stack
    secrets:
      - db-password
      - backblaze-application-key-id
      - backblaze-application-key
    environment:
      - HOST_ID=eu1
      - DATABASE=linkshift
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD_FILE=/run/secrets/db-password
      - DB_PORT=5432
      - NODE_ENV=production
      - BACKBLAZE_APPLICATION_KEY_ID_FILE=/run/secrets/backblaze-application-key-id
      - BACKBLAZE_APPLICATION_KEY_FILE=/run/secrets/backblaze-application-key
    deploy:
      resources:
        limits:
          memory: 500M
          cpus: "0.50"
      replicas: 1

networks:
  inter-stack:
    external: true
    name: ${SWARM_OVERLAY_NETWORK}

secrets:
  database_url:
    external: true
  redis_password:
    external: true
  jwt_secret:
    external: true
  jwt_refresh_secret:
    external: true
  sentry_dsn:
    external: true
  paddle_api_key:
    external: true
  paddle_webhook_secret:
    external: true
  zeptomail_api_key:
    external: true
  web_risk_api_key:
    external: true
  db-password:
    external: true
  backblaze-application-key-id:
    external: true
  backblaze-application-key:
    external: true
