version: "3.8"

services:
  frontend:
    image: ${FRONTEND_IMAGE}
    environment:
      PORT: "4000"
      APP_API_BASE_URL: ${APP_API_BASE_URL}
      APP_SITE_NAME: ${APP_SITE_NAME}
      APP_SITE_TAGLINE: ${APP_SITE_TAGLINE}
      APP_SUPPORT_EMAIL: ${APP_SUPPORT_EMAIL}
      APP_LEGAL_NAME: ${APP_LEGAL_NAME}
      APP_LEGAL_ADDRESS: ${APP_LEGAL_ADDRESS}
      APP_PRIVACY_EMAIL: ${APP_PRIVACY_EMAIL}
      APP_MIN_AGE: ${APP_MIN_AGE}
      APP_LEGAL_VERSION: ${APP_LEGAL_VERSION}
    networks:
      - inter-stack
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.swarm.network=${TRAEFIK_SWARM_NETWORK}
        - traefik.http.routers.frontend.rule=Host(`${FRONTEND_HOST}`)
        - traefik.http.routers.frontend.entrypoints=websecure
        - traefik.http.routers.frontend.tls.certresolver=default
        - traefik.http.services.frontend.loadbalancer.server.port=4000

  backend:
    image: ${BACKEND_IMAGE}
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_HOSTNAME: ${BACKEND_HOST}
      APP_WEB_URL: ${APP_WEB_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TRUST_PROXY: "true"
      HOST_ID: ${HOST_ID}
      LEGAL_VERSION: ${LEGAL_VERSION}
      LEGAL_MIN_AGE: ${LEGAL_MIN_AGE}
      LEGAL_ENTITY_NAME: ${LEGAL_ENTITY_NAME}
      LEGAL_ENTITY_ADDRESS: ${LEGAL_ENTITY_ADDRESS}
      PRIVACY_EMAIL: ${PRIVACY_EMAIL}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: default
      SAFE_BROWSING_CLIENT_ID: ${SAFE_BROWSING_CLIENT_ID}
      SAFE_BROWSING_CLIENT_VERSION: ${SAFE_BROWSING_CLIENT_VERSION}
      LEMON_SQUEEZY_STORE_ID: ${LEMON_SQUEEZY_STORE_ID}
      LEMON_SQUEEZY_SUCCESS_URL: ${LEMON_SQUEEZY_SUCCESS_URL}
      LEMON_SQUEEZY_VARIANT_STARTER_ID: ${LEMON_SQUEEZY_VARIANT_STARTER_ID}
      LEMON_SQUEEZY_VARIANT_PRO_ID: ${LEMON_SQUEEZY_VARIANT_PRO_ID}
      ZEPTOMAIL_API_URL: ${ZEPTOMAIL_API_URL}
      ZEPTOMAIL_FROM_ADDRESS: ${ZEPTOMAIL_FROM_ADDRESS}
      ZEPTOMAIL_FROM_NAME: ${ZEPTOMAIL_FROM_NAME}
      EMAIL_FROM: ${EMAIL_FROM}
      TRAEFIK_UPDATE_ENABLED: ${TRAEFIK_UPDATE_ENABLED}
      TRAEFIK_TARGET_SERVICE: ${TRAEFIK_TARGET_SERVICE}
      TRAEFIK_ROUTER_RULE_LABEL: ${TRAEFIK_ROUTER_RULE_LABEL}
      TRAEFIK_BASE_HOSTS: ${TRAEFIK_BASE_HOSTS}
    secrets:
      - database_url
      - redis_password
      - jwt_secret
      - jwt_refresh_secret
      - sentry_dsn
      - lemon_squeezy_api_key
      - lemon_squeezy_webhook_secret
      - zeptomail_api_key
      - safe_browsing_api_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - inter-stack
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.swarm.network=${TRAEFIK_SWARM_NETWORK}
        - traefik.http.routers.backend.rule=Host(`${BACKEND_HOST}`)
        - traefik.http.routers.backend.entrypoints=websecure
        - traefik.http.routers.backend.tls.certresolver=default
        - traefik.http.services.backend.loadbalancer.server.port=3000

  db-backup:
    image: ghcr.io/p-zielinski/project4-db-backup:${GIT_COMMIT_HASH:-latest}
    networks:
      - inter-stack
    secrets:
      - db-password
      - backblaze-application-key-id
      - backblaze-application-key
    environment:
      - HOST_ID=eu1
      - DATABASE=core
      - DB_HOST=postgres.project4_inter-stack-network
      - DB_USER=postgres
      - DB_PASSWORD_FILE=/run/secrets/db-password
      - DB_PORT=5432
      - NODE_ENV=production
      - BACKBLAZE_APPLICATION_KEY_ID_FILE=/run/secrets/backblaze-application-key-id
      - BACKBLAZE_APPLICATION_KEY_FILE=/run/secrets/backblaze-application-key
    deploy:
      resources:
        limits:
          memory: 500M
          cpus: "0.50"
      replicas: 1

networks:
  inter-stack:
    external: true
    name: ${TRAEFIK_SWARM_NETWORK}

secrets:
  database_url:
    external: true
  redis_password:
    external: true
  jwt_secret:
    external: true
  jwt_refresh_secret:
    external: true
  sentry_dsn:
    external: true
  lemon_squeezy_api_key:
    external: true
  lemon_squeezy_webhook_secret:
    external: true
  zeptomail_api_key:
    external: true
  safe_browsing_api_key:
    external: true
  db-password:
    external: true
  backblaze-application-key-id:
    external: true
  backblaze-application-key:
    external: true
