name: Deploy Application Stack (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file for backend build
        run: |
          echo "${{ secrets.STACK_ENV }}" > .env
          echo "GIT_COMMIT_HASH=${{ github.sha }}" >> .env

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/linkshift-backend:latest
            ghcr.io/${{ github.repository_owner }}/linkshift-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load frontend build args from STACK_ENV
        run: |
          cat <<'EOF' > ./stack.env
          ${{ secrets.STACK_ENV }}
          EOF
          set -a
          . ./stack.env
          set +a
          {
            echo "APP_DOMAIN_TARGET_IP=$APP_DOMAIN_TARGET_IP"
            echo "APP_BASE_URL=$APP_BASE_URL"
            echo "APP_TOOLS_BASE_URL=$APP_TOOLS_BASE_URL"
            echo "APP_SITE_NAME=$APP_SITE_NAME"
            echo "APP_SITE_TAGLINE=$APP_SITE_TAGLINE"
            echo "APP_SUPPORT_EMAIL=$APP_SUPPORT_EMAIL"
            echo "APP_LEGAL_NAME=$APP_LEGAL_NAME"
            echo "APP_LEGAL_ADDRESS=$APP_LEGAL_ADDRESS"
            echo "APP_PRIVACY_EMAIL=$APP_PRIVACY_EMAIL"
            echo "APP_MIN_AGE=$APP_MIN_AGE"
            echo "APP_LEGAL_VERSION=$APP_LEGAL_VERSION"
            echo "APP_PADDLE_CLIENT_TOKEN=$APP_PADDLE_CLIENT_TOKEN"
            echo "APP_AUTH_GATE_ENABLED=$APP_AUTH_GATE_ENABLED"
          } >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            APP_DOMAIN_TARGET_IP=${{ env.APP_DOMAIN_TARGET_IP }}
            APP_BASE_URL=${{ env.APP_BASE_URL }}
            APP_TOOLS_BASE_URL=${{ env.APP_TOOLS_BASE_URL }}
            APP_SITE_NAME=${{ env.APP_SITE_NAME }}
            APP_SITE_TAGLINE=${{ env.APP_SITE_TAGLINE }}
            APP_SUPPORT_EMAIL=${{ env.APP_SUPPORT_EMAIL }}
            APP_LEGAL_NAME=${{ env.APP_LEGAL_NAME }}
            APP_LEGAL_ADDRESS=${{ env.APP_LEGAL_ADDRESS }}
            APP_PRIVACY_EMAIL=${{ env.APP_PRIVACY_EMAIL }}
            APP_MIN_AGE=${{ env.APP_MIN_AGE }}
            APP_LEGAL_VERSION=${{ env.APP_LEGAL_VERSION }}
            APP_PADDLE_CLIENT_TOKEN=${{ env.APP_PADDLE_CLIENT_TOKEN }}
            APP_AUTH_GATE_ENABLED=${{ env.APP_AUTH_GATE_ENABLED }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/linkshift-frontend:latest
            ghcr.io/${{ github.repository_owner }}/linkshift-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-db-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push db-backup image
        uses: docker/build-push-action@v6
        with:
          context: ./backup-db
          file: ./backup-db/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/linkshift-db-backup:latest
            ghcr.io/${{ github.repository_owner }}/linkshift-db-backup:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-frontend
      - build-db-backup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create stack env file
        run: |
          cat <<EOF > ./stack.env
          ${{ secrets.STACK_ENV }}
          BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/linkshift-backend:${{ github.sha }}
          FRONTEND_IMAGE=ghcr.io/${{ github.repository_owner }}/linkshift-frontend:${{ github.sha }}
          GIT_COMMIT_HASH=${{ github.sha }}
          EOF

      - name: Deploy app stack (Attempt 1)
        id: deploy_attempt_1
        continue-on-error: true
        uses: cssnr/stack-deploy-action@v1
        with:
          name: linkshift-app
          file: docker-stack.app.yml
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          ssh_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          env_file: ./stack.env
          registry_host: ghcr.io
          registry_user: ${{ secrets.DEPLOY_REGISTRY_USER }}
          registry_pass: ${{ secrets.DEPLOY_REGISTRY_PASS }}

      - name: Wait before retry
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: sleep 15

      - name: Deploy app stack (Retry)
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: cssnr/stack-deploy-action@v1
        with:
          name: linkshift-app
          file: docker-stack.app.yml
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          ssh_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          env_file: ./stack.env
          registry_host: ghcr.io
          registry_user: ${{ secrets.DEPLOY_REGISTRY_USER }}
          registry_pass: ${{ secrets.DEPLOY_REGISTRY_PASS }}
