name: Deploy Infrastructure Stack (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  INFRA_STACK_NAME: linkshift-infra

concurrency:
  group: deploy-infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-caddy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./config/Dockerfile.caddy
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/linkshift-caddy-cloudflare:latest
            ghcr.io/${{ github.repository_owner }}/linkshift-caddy-cloudflare:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-infra:
    runs-on: ubuntu-latest
    needs:
      - build-caddy
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create stack env file
        run: |
          cat <<EOF > ./stack.env
          ${{ secrets.STACK_ENV }}
          GIT_COMMIT_HASH=${GITHUB_SHA}
          CADDY_IMAGE=ghcr.io/${{ github.repository_owner }}/linkshift-caddy-cloudflare:${GITHUB_SHA}
          CONFIG_VERSION=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          EOF

      - name: Create Dozzle users config
        env:
          DOZZLE_USERS_YML: ${{ secrets.DOZZLE_USERS_YML }}
        run: |
          mkdir -p ./config
          if [ -z "$DOZZLE_USERS_YML" ]; then
            echo "Missing required GitHub secret: DOZZLE_USERS_YML" >&2
            exit 1
          fi
          printf '%s\n' "$DOZZLE_USERS_YML" > ./config/dozzle.users.yml
          if [ ! -s ./config/dozzle.users.yml ]; then
            echo "Generated ./config/dozzle.users.yml is empty" >&2
            exit 1
          fi

      - name: Deploy infra stack (Attempt 1)
        id: deploy_attempt_1
        continue-on-error: true
        uses: cssnr/stack-deploy-action@v1
        with:
          name: ${{ env.INFRA_STACK_NAME }}
          file: docker-stack.infra.yml
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          ssh_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          env_file: ./stack.env
          registry_host: ghcr.io
          registry_user: ${{ secrets.DEPLOY_REGISTRY_USER }}
          registry_pass: ${{ secrets.DEPLOY_REGISTRY_PASS }}

      - name: Wait before retry
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: sleep 15

      - name: Deploy infra stack (Retry)
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: cssnr/stack-deploy-action@v1
        with:
          name: ${{ env.INFRA_STACK_NAME }}
          file: docker-stack.infra.yml
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          ssh_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          env_file: ./stack.env
          registry_host: ghcr.io
          registry_user: ${{ secrets.DEPLOY_REGISTRY_USER }}
          registry_pass: ${{ secrets.DEPLOY_REGISTRY_PASS }}
