name: Deploy Tools Application Stack (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TOOLS_APP_STACK_NAME: linkshift-tools-app

concurrency:
  group: deploy-tools-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-backend-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file for backend-tools build
        run: |
          echo "${{ secrets.STACK_ENV }}" > .env
          echo "GIT_COMMIT_HASH=${{ github.sha }}" >> .env

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend-tools image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend-tools/Dockerfile
          # Changed to amd64 to fix "unsupported platform" on standard x86_64 nodes
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/linkshift-backend-tools:latest
            ghcr.io/${{ github.repository_owner }}/linkshift-backend-tools:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-tools-app:
    runs-on: ubuntu-latest
    needs:
      - build-backend-tools
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create stack env file
        run: |
          cat <<EOF > ./stack.env
          ${{ secrets.STACK_ENV }}
          BACKEND_TOOLS_IMAGE=ghcr.io/${{ github.repository_owner }}/linkshift-backend-tools:${{ github.sha }}
          GIT_COMMIT_HASH=${{ github.sha }}
          EOF

      - name: Deploy tools app stack (Attempt 1)
        id: deploy_attempt_1
        continue-on-error: true
        uses: cssnr/stack-deploy-action@v1
        with:
          name: ${{ env.TOOLS_APP_STACK_NAME }}
          file: docker-stack.tools.app.yml
          host: ${{ secrets.DEPLOY_TOOLS_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          ssh_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          env_file: ./stack.env
          registry_host: ghcr.io
          registry_user: ${{ secrets.DEPLOY_REGISTRY_USER }}
          registry_pass: ${{ secrets.DEPLOY_REGISTRY_PASS }}

      - name: Wait before retry
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: sleep 15

      - name: Deploy tools app stack (Retry)
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: cssnr/stack-deploy-action@v1
        with:
          name: ${{ env.TOOLS_APP_STACK_NAME }}
          file: docker-stack.tools.app.yml
          host: ${{ secrets.DEPLOY_TOOLS_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          ssh_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          env_file: ./stack.env
          registry_host: ghcr.io
          registry_user: ${{ secrets.DEPLOY_REGISTRY_USER }}
          registry_pass: ${{ secrets.DEPLOY_REGISTRY_PASS }}
