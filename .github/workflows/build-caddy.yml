name: Build Caddy Image (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-caddy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-caddy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./config/Dockerfile.caddy
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/linkshift-caddy-cloudflare:latest
            ghcr.io/${{ github.repository_owner }}/linkshift-caddy-cloudflare:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
