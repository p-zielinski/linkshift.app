version: "3.8"

services:
  backend-tools:
    image: ${BACKEND_TOOLS_IMAGE}
    environment:
      NODE_ENV: production
      PORT: "3030"
      APP_WEB_URL: ${APP_WEB_URL}
      APP_TOOLS_BASE_URL: ${APP_TOOLS_BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DOCS_ASSISTANT_ROUTER_MODEL: ${DOCS_ASSISTANT_ROUTER_MODEL}
      DOCS_ASSISTANT_GENERATOR_MODEL: ${DOCS_ASSISTANT_GENERATOR_MODEL}
      DOCS_ASSISTANT_MODEL_PRICING_JSON: ${DOCS_ASSISTANT_MODEL_PRICING_JSON}
      DOCS_ASSISTANT_RATE_LIMIT_PER_MINUTE: ${DOCS_ASSISTANT_RATE_LIMIT_PER_MINUTE}
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${CLOUDFLARE_TURNSTILE_SECRET_KEY}
      TURNSTILE_SKIP_VERIFY: ${TURNSTILE_SKIP_VERIFY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      TRUST_PROXY: "true"
      REDIS_HOST: redis-tools
      REDIS_PORT: "6379"
      REDIS_USERNAME: default
      QR_RATE_LIMIT_PER_MINUTE: "600"
      TRACE_RATE_LIMIT_PER_MINUTE: "240"
      MCP_RATE_LIMIT_PER_MINUTE: "180"
    secrets:
      - tools_redis_password
    networks:
      inter-stack:
        aliases:
          - backend-tools
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        monitor: 20s
        max_failure_ratio: 0
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
        monitor: 20s
        max_failure_ratio: 0
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 30s
      resources:
        limits:
          cpus: "1.00"
          memory: 640M

networks:
  inter-stack:
    external: true
    name: ${SWARM_OVERLAY_NETWORK}

secrets:
  tools_redis_password:
    external: true
