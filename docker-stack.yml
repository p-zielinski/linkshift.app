version: "3.8"

services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.swarmMode=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - public
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  frontend:
    image: ${FRONTEND_IMAGE}
    environment:
      PORT: "4000"
      APP_API_BASE_URL: ${APP_API_BASE_URL}
      APP_SITE_NAME: ${APP_SITE_NAME}
      APP_SITE_TAGLINE: ${APP_SITE_TAGLINE}
      APP_SUPPORT_EMAIL: ${APP_SUPPORT_EMAIL}
      APP_LEGAL_NAME: ${APP_LEGAL_NAME}
      APP_LEGAL_ADDRESS: ${APP_LEGAL_ADDRESS}
      APP_PRIVACY_EMAIL: ${APP_PRIVACY_EMAIL}
      APP_MIN_AGE: ${APP_MIN_AGE}
      APP_LEGAL_VERSION: ${APP_LEGAL_VERSION}
    networks:
      - public
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=public
        - traefik.http.routers.frontend.rule=Host(`${FRONTEND_HOST}`)
        - traefik.http.routers.frontend.entrypoints=web
        - traefik.http.services.frontend.loadbalancer.server.port=4000

  backend:
    image: ${BACKEND_IMAGE}
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_HOSTNAME: ${BACKEND_HOST}
      APP_WEB_URL: ${APP_WEB_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TRUST_PROXY: "true"
      HOST_ID: ${HOST_ID}
      LEGAL_VERSION: ${LEGAL_VERSION}
      LEGAL_MIN_AGE: ${LEGAL_MIN_AGE}
      LEGAL_ENTITY_NAME: ${LEGAL_ENTITY_NAME}
      LEGAL_ENTITY_ADDRESS: ${LEGAL_ENTITY_ADDRESS}
      PRIVACY_EMAIL: ${PRIVACY_EMAIL}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: default
      SAFE_BROWSING_API_KEY: ${SAFE_BROWSING_API_KEY}
      SAFE_BROWSING_CLIENT_ID: ${SAFE_BROWSING_CLIENT_ID}
      SAFE_BROWSING_CLIENT_VERSION: ${SAFE_BROWSING_CLIENT_VERSION}
      LEMON_SQUEEZY_STORE_ID: ${LEMON_SQUEEZY_STORE_ID}
      LEMON_SQUEEZY_SUCCESS_URL: ${LEMON_SQUEEZY_SUCCESS_URL}
      LEMON_SQUEEZY_CANCEL_URL: ${LEMON_SQUEEZY_CANCEL_URL}
      LEMON_SQUEEZY_VARIANT_STARTER_ID: ${LEMON_SQUEEZY_VARIANT_STARTER_ID}
      LEMON_SQUEEZY_VARIANT_PRO_ID: ${LEMON_SQUEEZY_VARIANT_PRO_ID}
      ZEPTOMAIL_API_URL: ${ZEPTOMAIL_API_URL}
      ZEPTOMAIL_FROM_ADDRESS: ${ZEPTOMAIL_FROM_ADDRESS}
      ZEPTOMAIL_FROM_NAME: ${ZEPTOMAIL_FROM_NAME}
      EMAIL_FROM: ${EMAIL_FROM}
    secrets:
      - database_url
      - redis_password
      - jwt_secret
      - jwt_refresh_secret
      - sentry_dsn
      - lemon_squeezy_api_key
      - lemon_squeezy_webhook_secret
      - zeptomail_api_key
      - safe_browsing_api_key
    networks:
      - public
      - internal
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=public
        - traefik.http.routers.backend.rule=Host(`${BACKEND_HOST}`)
        - traefik.http.routers.backend.entrypoints=web
        - traefik.http.services.backend.loadbalancer.server.port=3000

  postgres:
    image: postgres:17.7
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  redis:
    image: redis:8.4.0
    command: >
      sh -c "redis-server --requirepass \"$$(cat /run/secrets/redis_password)\""
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    networks:
      - internal
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    configs:
      - source: loki_config
        target: /etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - internal
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  promtail:
    image: grafana/promtail:latest
    command: -config.file=/etc/promtail/config.yml
    configs:
      - source: promtail_config
        target: /etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - internal
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - public
      - internal
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=public
        - traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST}`)
        - traefik.http.routers.grafana.entrypoints=web
        - traefik.http.services.grafana.loadbalancer.server.port=3000

  dozzle:
    image: amir20/dozzle:latest
    environment:
      DOZZLE_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - public
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=public
        - traefik.http.routers.dozzle.rule=Host(`${DOZZLE_HOST}`)
        - traefik.http.routers.dozzle.entrypoints=web
        - traefik.http.services.dozzle.loadbalancer.server.port=8080

networks:
  public:
    driver: overlay
    attachable: true
  internal:
    driver: overlay
    attachable: true
    internal: true

volumes:
  postgres-data:
  redis-data:
  grafana-data:
  loki-data:

configs:
  loki_config:
    file: ./config/loki.yaml
  promtail_config:
    file: ./config/promtail.yaml

secrets:
  postgres_password:
    external: true
  database_url:
    external: true
  redis_password:
    external: true
  jwt_secret:
    external: true
  jwt_refresh_secret:
    external: true
  sentry_dsn:
    external: true
  lemon_squeezy_api_key:
    external: true
  lemon_squeezy_webhook_secret:
    external: true
  zeptomail_api_key:
    external: true
  safe_browsing_api_key:
    external: true
