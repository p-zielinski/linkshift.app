version: "3.8"

services:
  caddy:
    image: ${CADDY_IMAGE:-linkshift/caddy-cloudflare:2.10.2}
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL}
      FRONTEND_HOST: ${FRONTEND_HOST}
      GRAFANA_HOST: ${GRAFANA_HOST}
      DOZZLE_HOST: ${DOZZLE_HOST}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    ports:
      - mode: host
        protocol: tcp
        published: 80
        target: 80
      - mode: host
        protocol: tcp
        published: 443
        target: 443
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    configs:
      - source: caddyfile_v24
        target: /etc/caddy/Caddyfile
    networks:
      - inter-stack
    deploy:
      update_config:
        order: start-first
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  postgres:
    image: postgres:17.7
    hostname: postgres
    ports:
      - mode: host
        protocol: tcp
        published: 5454
        target: 5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      inter-stack:
        aliases:
          - postgres
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  redis:
    image: redis:8.4.0
    hostname: redis
    ports:
      - mode: host
        protocol: tcp
        published: 6767
        target: 6379
    command: >
      sh -c "redis-server --requirepass \"$$(cat /run/secrets/redis_password)\" --appendonly yes"
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    networks:
      inter-stack:
        aliases:
          - redis
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    configs:
      - source: loki_config
        target: /etc/loki/local-config.yaml
    volumes:
      - /mnt/loki:/loki
    networks:
      - inter-stack
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  promtail:
    image: grafana/promtail:latest
    command: -config.file=/etc/promtail/config.yml
    configs:
      - source: promtail_config
        target: /etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - inter-stack
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

  grafana:
    image: grafana/grafana:latest
    ports:
      - mode: host
        protocol: tcp
        published: 5050
        target: 5050
    environment:
      GF_SERVER_HTTP_PORT: 5050
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      inter-stack:
        aliases:
          - grafana
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  dozzle:
    image: amir20/dozzle:latest
    environment:
      DOZZLE_LEVEL: info
      DOZZLE_AUTH_PROVIDER: simple
    configs:
      - source: dozzle_users_v5
        target: /data/users.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dozzle-data:/data
    networks:
      inter-stack:
        aliases:
          - dozzle
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  inter-stack:
    external: true
    name: ${SWARM_OVERLAY_NETWORK}

volumes:
  postgres-data:
  redis-data:
  grafana-data:
  dozzle-data:
  caddy_data:
  caddy_config:

configs:
  loki_config:
    file: ./config/loki.yaml
  promtail_config:
    file: ./config/promtail.yaml
  dozzle_users_v5:
    file: config/dozzle.users.yml
  caddyfile_v24:
    file: ./config/Caddyfile

secrets:
  postgres_password:
    external: true
  redis_password:
    external: true
  grafana_admin_password:
    external: true
